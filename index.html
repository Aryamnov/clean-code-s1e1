<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="title">
      <img
        src="./eisenhower-matrix.jpg"
        alt="The picture shows the Eisenhower Matrix with a brief description."
        class="title__image"
      >
      <aside>
        <a
          class="title__link"
          href="https://goal-life.com/page/method/matrix-eisenhower"
        >
          Want more details?
        </a>
      </aside>
    </header>
    <main class="app">
      <div id="section-create-task" class="app__new-block">
        <label class="app__label" for="new-task">Add Item</label>
        <div class="app__container">
          <input
            id="new-task"
            class="app__input app__element"
            type="text"
          >
          <button class="app__button">Add</button>
        </div>
      </div>
      <h3 class="app__subtitle">Todo</h3>
      <ul class="app__list" id="incomplete-tasks">
        <li class="app__item">
          <input class="app__input" type="checkbox">
          <label class="app__label app__element">Pay Bills</label>
          <input type="text" class="app__input app__element">
          <button class="app__button app__button_edit">Edit</button>
          <button class="app__button app__button_delete">
            <img
              src="./remove.svg"
              alt="delete icon in the form of a cross."
              class="app__icon-delete"
            >
          </button>
        </li>
        <li class="app__item app__item_edit">
          <input class="app__input" type="checkbox">
          <label class="app__label app__element">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="app__input app__element"
          >
          <button class="app__button app__button_edit">Save</button>
          <button class="app__button app__button_delete">
            <img
              src="./remove.svg"
              alt="delete icon in the form of a cross."
              class="app__icon-delete"
            >
          </button>
        </li>
      </ul>
      <h3 class="app__subtitle">Completed</h3>
      <ul class="app__list" id="completed-tasks">
        <li class="app__item">
          <input class="app__input" type="checkbox" checked>
          <label class="app__label app__element">See the Doctor</label>
          <input type="text" class="app__input app__element">
          <button class="app__button app__button_edit">Edit</button>
          <button class="app__button app__button_delete">
            <img
              src="./remove.svg"
              alt="delete icon in the form of a cross."
              class="app__icon-delete"
            >
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
