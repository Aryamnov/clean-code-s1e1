<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <div class="title">
      <img
        src="./eisenhower-matrix.jpg"
        alt="The picture shows the Eisenhower Matrix with a brief description."
      >
      <a
        class="title__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </div>
    <div class="app">
      <p id="section-create-task">
        <label for="new-task">Add Item</label>
        <div class="app__container">
          <input
            id="new-task"
            class="app__element"
            type="text"
          >
          <button>Add</button>
        </div>
      </p>
      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li class="app__item">
          <input type="checkbox">
          <label class="app__element">Pay Bills</label>
          <input type="text" class="app__element">
          <button class="app__button app__button_edit">Edit</button>
          <button class="app__button app__button_delete">
            <img
              src="./remove.svg"
              alt="delete icon in the form of a cross."
            >
          </button>
        </li>
        <li class="app__item app__item_edit">
          <input type="checkbox">
          <label class="app__element">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="app__element"
          >
          <button class="app__button app__button_edit">Save</button>
          <button class="app__button app__button_delete">
            <img
              src="./remove.svg"
              alt="delete icon in the form of a cross."
            >
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li class="app__item">
          <input type="checkbox" checked>
          <label class="app__element">See the Doctor</label>
          <input type="text" class="app__element">
          <button class="app__button app__button_edit">Edit</button>
          <button class="app__button app__button_delete">
            <img
              src="./remove.svg"
              alt="delete icon in the form of a cross."
            >
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
